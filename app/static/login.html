<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Net Worth – Sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='system-ui'>₹</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="logo">₹</span> Net Worth</div>
      <h1 id="title">Sign in</h1>
      <p class="muted" id="subtitle">Your financial data is locked. Sign in to continue.</p>
      <form id="form" class="form" autocomplete="on">
        <label>Username<input name="username" id="username" autocomplete="username" required maxlength="60" autofocus></label>
        <label>Password<input name="password" id="password" type="password" autocomplete="current-password" required maxlength="200"></label>
        <label id="confirm-wrap" hidden>Repeat password<input name="confirm" id="confirm" type="password" autocomplete="new-password" maxlength="200"></label>
        <div class="hint" id="hint" hidden></div>
        <div class="login-error" id="error" role="alert" hidden></div>
        <button class="primary" type="submit" id="submit">Sign in</button>
      </form>
    </div>
    <p class="muted login-foot">Runs only on this computer. Forgot your password? See README → “Reset password”.</p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
